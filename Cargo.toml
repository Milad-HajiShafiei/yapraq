[package]
name = "yapraq"
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
description = "A beautiful terminal-based system monitor and workspace manager"
license = "MIT"
repository = "https://github.com/Milad-HajiShafiei/yapraq"
readme = "README.md"
keywords = ["tui", "terminal", "monitor", "file-manager", "system"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Milad Hajishafiei <https://github.com/Milad-HajiShafiei/yapraq>"]

[dependencies]
# TUI & Backend
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"

# System & Hardware
sysinfo = "0.39.6"
rusb = "0.9.4"

# Filesystem
walkdir = "2.5.0"

# Async Runtime
tokio = { version = "1.53.1", features = ["full"] }

# Utilities
anyhow = "1.0.104"
directories = "6.0.0"
dirs = "6.0.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
